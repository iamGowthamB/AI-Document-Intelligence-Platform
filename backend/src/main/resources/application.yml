server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rag_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:16MB}
      max-request-size: ${MAX_REQUEST_SIZE:16MB}

# Application-specific Custom Settings
app:
  jwt:
    secret: ${JWT_SECRET:ZGV2X3NlY3JldF9rZXlfZGV2X3NlY3JldF9rZXlfZGV2X3NlY3JldF9rZXk=}
    expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
  ai-engine:
    base-url: ${AI_ENGINE_BASE_URL:http://localhost:5000}
  upload-dir: ${APP_UPLOAD_DIR:stored_documents}

